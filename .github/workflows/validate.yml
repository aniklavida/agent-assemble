name: Validate repository

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            docs/SPEC.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject unresolved merge markers and machine paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|/Users/[^/]+/|<owner>' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Repository contains a merge marker, machine-specific path, or owner placeholder."
            exit 1
          fi

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|ntn_[A-Za-z0-9]{20,})' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential credential detected."
            exit 1
          fi

      - name: No instruction may tell an agent to execute a remote document
        shell: bash
        run: |
          set -euo pipefail
          # An agent reads these files and acts on them with a shell. An
          # instruction to fetch and run something from a URL is remote code
          # execution with the blast radius of the user's machine. SECURITY.md
          # forbids it; this is the check that makes that real.
          if grep -RInE '(curl|wget|iwr|Invoke-WebRequest)[^|]*\|[[:space:]]*(ba)?sh' \
            --exclude-dir=.git --exclude=validate.yml . ; then
            echo "An instruction pipes a download into a shell. See SECURITY.md."
            exit 1
          fi

      - name: Claims use the four permitted states
        shell: bash
        run: |
          set -euo pipefail
          # The README describes a product that does not exist yet. Until it
          # does, it must say so. This fails if the status line is removed or
          # weakened before there is something to describe.
          grep -q 'Status: planned' README.md || {
            echo "README no longer states that the product is planned."
            echo "Remove this check only when something is genuinely implemented."
            exit 1
          }

      - name: Enforce per-node word budget on always-loaded core files
        shell: bash
        run: |
          set -euo pipefail
          # A node's always-loaded core (SKILL.md) has a hard ceiling of 200 words
          # to prevent exhausting an agent's context budget. References loaded on
          # demand remain unlimited.
          bash scripts/check-word-budget.sh

      - name: Verify the documentation-drift reconciliation fixture
        shell: bash
        run: |
          set -euo pipefail
          # The fixture is the only evidence this procedure produces the outcome it
          # describes. A check nothing runs is a check that does not exist.
          bash scripts/verify-drift-reconciliation.sh

      - name: Verify per-criterion sabotage evidence on completed task items
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: board/ and fixtures/ excluding the bad-fixture directory.
          # Every done, non-direct item must carry a named test, a named mutation,
          # and a resolved sabotage outcome per acceptance criterion.
          bash scripts/check-evidence.sh

          # Bad-fixture sweep: must exit non-zero, proving violations are detected.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixtures unexpectedly pass the check.
          if bash scripts/check-evidence.sh fixtures/sabotage-evidence/bad 2>/dev/null; then
            echo "Bad fixtures passed check-evidence.sh — violations are not being detected." >&2
            exit 1
          fi

      - name: Verify role skeleton check on good and bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: fixtures/role-skeleton/good must pass.
          bash scripts/check-role-skeleton.sh fixtures/role-skeleton/good

          # Bad-fixture sweep: fixtures/role-skeleton/bad must exit non-zero.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixture unexpectedly passes the check.
          if bash scripts/check-role-skeleton.sh fixtures/role-skeleton/bad 2>/dev/null; then
            echo "Bad fixture passed check-role-skeleton.sh — missing sections are not being detected." >&2
            exit 1
          fi

      - name: Verify workflow data check on good and bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: fixtures/workflows-as-data must pass.
          bash scripts/check-workflow-data.sh fixtures/workflows-as-data security-review

          # Bad-fixture sweep: a fixture with modified SKILL.md must exit non-zero.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixture unexpectedly passes the check.
          mkdir -p /tmp/check_workflow_bad/workflow /tmp/check_workflow_bad/log
          cp fixtures/workflows-as-data/workflow/workflows.md /tmp/check_workflow_bad/workflow/
          cp fixtures/workflows-as-data/workflow/SKILL.md /tmp/check_workflow_bad/workflow/SKILL.md
          echo "# MODIFIED" >> /tmp/check_workflow_bad/workflow/SKILL.md
          if bash scripts/check-workflow-data.sh /tmp/check_workflow_bad security-review 2>/dev/null; then
            echo "Bad fixture passed check-workflow-data.sh — SKILL.md modifications are not being detected." >&2
            exit 1
          fi

      - name: Verify workflow override check on good and bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: fixtures/override-resolution must pass.
          bash scripts/check-workflow-override.sh fixtures/override-resolution BA

          # Bad-fixture sweep: a fixture missing the override file must exit non-zero.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixture unexpectedly passes the check.
          mkdir -p /tmp/check_override_bad/.agent-assemble/roles/BA /tmp/check_override_bad/employees/BA /tmp/check_override_bad/log
          cp fixtures/override-resolution/employees/BA/SKILL.md /tmp/check_override_bad/employees/BA/
          cp fixtures/override-resolution/log/LOG.md /tmp/check_override_bad/log/
          if bash scripts/check-workflow-override.sh /tmp/check_override_bad BA 2>/dev/null; then
            echo "Bad fixture passed check-workflow-override.sh — missing override files are not being detected." >&2
            exit 1
          fi

      - name: Measure composed budget for the three-level Node.js role
        shell: bash
        run: |
          set -euo pipefail
          # The three cores (software-engineer + backend-developer + nodejs) are
          # composed and counted together. The ceiling is 600 words. A three-level
          # composition that fits proves the vertical slice is deployable.
          bash scripts/check-composed-budget.sh \
            employees/software-engineer/backend-developer/nodejs 600

      - name: Check for duplicate sentences across role cores
        shell: bash
        run: |
          set -euo pipefail
          # No sentence may appear verbatim in two role cores. The good sweep
          # covers the shipped employees/ tree. The bad-fixture sweep must fail,
          # proving that deliberate duplication is detected.
          bash scripts/check-duplicate-sentences.sh employees

          # Bad-fixture sweep: fixtures/duplicate-sentences/bad contains two
          # SKILL.md files with a shared sentence. Must exit non-zero.
          if bash scripts/check-duplicate-sentences.sh \
               fixtures/duplicate-sentences/bad 2>/dev/null; then
            echo "Bad fixture passed check-duplicate-sentences.sh — duplicates are not being detected." >&2
            exit 1
          fi

      - name: Verify fourth-level composition boundary enforcement
        shell: bash
        run: |
          set -euo pipefail
          # Adding a fourth level to the three-level slice produces a composed
          # budget that exceeds the 600-word ceiling. The script must exit non-zero,
          # proving that an overflowing fourth level is blocked loudly.
          if bash scripts/check-composed-budget.sh \
               fixtures/vertical-slice/fourth-level/nodejs/specialised-runtime \
               600 2>/dev/null; then
            echo "Fourth-level composition passed the budget check — overflow is not being detected." >&2
            exit 1
          fi

      - name: Prove inheritance is load-bearing for the Node.js vertical slice
        shell: bash
        run: |
          set -euo pipefail
          # Removing Backend Developer from the composition must change the
          # composed role's behaviour: the licence-policy instruction disappears.
          # This script composes the full three-level role and a partial two-level
          # role (backend-developer omitted) and confirms the difference is
          # present in full and absent in partial.
          bash scripts/check-inheritance-proof.sh

      - name: Verify three-mode principle system on good and bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Good sweep: fixtures/principles must pass, proving the four checks work.
          bash scripts/check-principles.sh fixtures/principles

          # Bad-fixture sweep: fixtures/principles/bad must exit non-zero, proving
          # the violations (a Prescriptive principle in the advisory-only fixture
          # and a verdict in the perspective fixture) are detected.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixture unexpectedly passes the check.
          if bash scripts/check-principles.sh fixtures/principles/bad 2>/dev/null; then
            echo "Bad fixture passed check-principles.sh — violations are not being detected." >&2
            exit 1
          fi

      - name: Verify SQA sabotage evidence fixtures (good passes, bad fails)
        shell: bash
        run: |
          set -euo pipefail
          # Good fixture: a card with complete per-criterion evidence must pass.
          bash scripts/check-evidence.sh fixtures/sqa-role/good

          # Bad fixture: a card with blank test/mutation/outcome must fail.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixture unexpectedly passes.
          if bash scripts/check-evidence.sh fixtures/sqa-role/bad 2>/dev/null; then
            echo "Bad SQA fixture passed check-evidence.sh — missing evidence is not being detected." >&2
            exit 1
          fi

      - name: Verify PM sizing-gate fixtures pass the evidence check
        shell: bash
        run: |
          set -euo pipefail
          # Direct-path cards carry no sabotage obligation; full-path cards must
          # carry per-criterion evidence. Both fixtures in sizing-gate/ must pass.
          bash scripts/check-evidence.sh fixtures/sizing-gate

      - name: Verify PM sizing-gate enforcement on good and bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: the structural log consequence of each declared size
          # must hold. Direct cards must have no BA/SQA entries; full cards must
          # have CARD_CREATED and VERIFICATION_PASSED.
          bash scripts/check-sizing-gate.sh fixtures/sizing-gate

          # Bad-fixture sweep: fixtures/sizing-gate/bad must exit non-zero.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixtures unexpectedly pass the check.
          if bash scripts/check-sizing-gate.sh fixtures/sizing-gate/bad 2>/dev/null; then
            echo "Bad fixtures passed check-sizing-gate.sh — sizing violations are not being detected." >&2
            exit 1
          fi

      - name: Verify BA card fixture has required frontmatter fields
        shell: bash
        run: |
          set -euo pipefail
          # The BA-produced card must carry all seven required frontmatter fields.
          card=fixtures/ba-card/TASK-BA-001.md
          for field in 'id:' 'title:' 'size:' 'status:' 'assigned_role:' 'created_at:' 'updated_at:'; do
            grep -q "$field" "$card" || {
              echo "BA card fixture is missing frontmatter field: $field" >&2
              exit 1
            }
          done
          echo "PASS: BA card fixture carries all required frontmatter fields."

      - name: Verify relay-trace fixture passes the evidence check
        shell: bash
        run: |
          set -euo pipefail
          # The end-to-end relay trace card must pass per-criterion evidence check,
          # proving the composed relay (PM -> BA -> Employee -> SQA -> PM) is complete.
          bash scripts/check-evidence.sh fixtures/relay-trace

      - name: Verify relay-trace log sequence on good and bad fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: the relay trace card's log trail must be complete,
          # in order, and owned by the right role.
          bash scripts/check-log-sequence.sh fixtures/relay-trace

          # Bad-fixture sweep: fixtures/relay-trace/bad (WORK_STARTED deleted)
          # must exit non-zero. The inversion below turns a non-zero exit into
          # zero and vice versa, so the step fails if the broken trail passes.
          if bash scripts/check-log-sequence.sh fixtures/relay-trace/bad 2>/dev/null; then
            echo "Bad fixture passed check-log-sequence.sh — broken log trails are not being detected." >&2
            exit 1
          fi

      - name: Verify board backend equivalence (Done-when #1)
        shell: bash
        run: |
          set -euo pipefail
          # The same operation sequence — create, move, read, append-log — must
          # produce equivalent contract state against Markdown, Obsidian and
          # Linear. Markdown/Obsidian run on real files; Linear runs against a
          # local stand-in because CI has no network or API key.
          bash scripts/check-board-adapters.sh

          # Self-test: a backend that leaves frontmatter stale on move must be
          # caught. If this unexpectedly passes, the equivalence check is not
          # load-bearing.
          bash scripts/check-board-adapters.sh --self-test

      - name: Verify setup connects to an existing board (Done-when #2)
        shell: bash
        run: |
          set -euo pipefail
          # A pre-seeded Markdown tree and Obsidian vault must be connected to,
          # not duplicated.
          bash scripts/check-board-connect-existing.sh

          # Self-test: two board roots must be detected and refused.
          bash scripts/check-board-connect-existing.sh --self-test

      - name: Verify unreachable board backend is refused at setup (Done-when #3)
        shell: bash
        run: |
          set -euo pipefail
          # Shipped instructions must state the external-backend limit where the
          # backend is chosen.
          bash scripts/check-board-reachability.sh --docs

          # Reachable configs pass.
          bash scripts/check-board-reachability.sh fixtures/board-adapters/reachability

          # An unreachable Linear choice must be refused with a reason naming the
          # missing capability. The inversion turns a non-zero exit from the
          # check into a failure of the step only if the reason is absent.
          out="$(bash scripts/check-board-reachability.sh \
                   fixtures/board-adapters/reachability/bad 2>&1)" && {
            echo "Unreachable Linear config passed — reachability is not enforced." >&2
            exit 1
          }
          echo "$out" | grep -q "requires an MCP server or API key" || {
            echo "Refusal did not name the missing capability. Output was:" >&2
            echo "$out" >&2
            exit 1
          }

      - name: Verify tools registry, licence policy and constraint filtering
        shell: bash
        run: |
          set -euo pipefail
          # Detection inventories a manifest-bearing fixture exactly, reports
          # this repository truthfully (no manifests, no dependencies), and
          # never blocks. Suggestions return only constraint-passing options;
          # a non-permissive compiled dependency and a tag masking a licence
          # change are both refused. The script runs its own fixture checks.
          bash scripts/check-tools-registry.sh

          # Detect mode against this repository must still exit 0.
          bash scripts/check-tools-registry.sh --detect . > /dev/null

