name: Validate repository

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            docs/SPEC.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject unresolved merge markers and machine paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|/Users/[^/]+/|<owner>' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Repository contains a merge marker, machine-specific path, or owner placeholder."
            exit 1
          fi

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|ntn_[A-Za-z0-9]{20,})' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential credential detected."
            exit 1
          fi

      - name: No instruction may tell an agent to execute a remote document
        shell: bash
        run: |
          set -euo pipefail
          # An agent reads these files and acts on them with a shell. An
          # instruction to fetch and run something from a URL is remote code
          # execution with the blast radius of the user's machine. SECURITY.md
          # forbids it; this is the check that makes that real.
          if grep -RInE '(curl|wget|iwr|Invoke-WebRequest)[^|]*\|[[:space:]]*(ba)?sh' \
            --exclude-dir=.git --exclude=validate.yml . ; then
            echo "An instruction pipes a download into a shell. See SECURITY.md."
            exit 1
          fi

      - name: Claims use the four permitted states
        shell: bash
        run: |
          set -euo pipefail
          # The README describes a product that does not exist yet. Until it
          # does, it must say so. This fails if the status line is removed or
          # weakened before there is something to describe.
          grep -q 'Status: planned' README.md || {
            echo "README no longer states that the product is planned."
            echo "Remove this check only when something is genuinely implemented."
            exit 1
          }

      - name: Enforce per-node word budget on always-loaded core files
        shell: bash
        run: |
          set -euo pipefail
          # A node's always-loaded core (SKILL.md) has a hard ceiling of 200 words
          # to prevent exhausting an agent's context budget. References loaded on
          # demand remain unlimited.
          bash scripts/check-word-budget.sh

      - name: Verify the documentation-drift reconciliation fixture
        shell: bash
        run: |
          set -euo pipefail
          # The fixture is the only evidence this procedure produces the outcome it
          # describes. A check nothing runs is a check that does not exist.
          bash scripts/verify-drift-reconciliation.sh

      - name: Verify per-criterion sabotage evidence on completed task items
        shell: bash
        run: |
          set -euo pipefail
          # Normal sweep: board/ and fixtures/ excluding the bad-fixture directory.
          # Every done, non-direct item must carry a named test, a named mutation,
          # and a resolved sabotage outcome per acceptance criterion.
          bash scripts/check-evidence.sh

          # Bad-fixture sweep: must exit non-zero, proving violations are detected.
          # The inversion below turns a non-zero exit into zero and vice versa, so
          # the step fails if the bad fixtures unexpectedly pass the check.
          if bash scripts/check-evidence.sh fixtures/sabotage-evidence/bad 2>/dev/null; then
            echo "Bad fixtures passed check-evidence.sh — violations are not being detected." >&2
            exit 1
          fi
